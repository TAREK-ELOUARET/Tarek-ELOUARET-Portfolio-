name: Lighthouse Audit

on:
  # Run right after the Pages deployment workflow finishes
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]

  # Also run weekly (Monday 06:00 UTC)
  schedule:
    - cron: "0 6 * * 1"

  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: "lighthouse"
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Only run when the deploy workflow succeeded (for workflow_run trigger)
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      # Checkout the exact commit that triggered the deploy (so LHCI can read git SHA)
      - name: Checkout (deployed commit)
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.workflow_run.head_sha }}

      # Checkout for schedule/manual runs
      - name: Checkout
        if: ${{ github.event_name != 'workflow_run' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Wait a bit for Pages to propagate
        run: sleep 90

      - name: Audit production URL with Lighthouse CI
        id: lh
        uses: treosh/lighthouse-ci-action@v12
        env:
          # Fallback so LHCI always knows which commit it's reporting for
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        with:
          urls: |
            https://tarek-elouaret.github.io/Tarek-ELOUARET-Portfolio-/
          runs: 3
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Add report links to job summary
        if: always()
        shell: bash
        run: |
          echo "## Lighthouse Reports" >> "$GITHUB_STEP_SUMMARY"
          LINKS='${{ steps.lh.outputs.links }}'
          if command -v jq >/dev/null 2>&1 && [ -n "$LINKS" ] && [ "$LINKS" != "null" ]; then
            echo "$LINKS" | jq -r 'to_entries[] | "- [Report for \(.key)](\(.value))"' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Report links (raw):" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
            echo "$LINKS" >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifacts are attached to this workflow run (look for the Lighthouse CI artifact)." >> "$GITHUB_STEP_SUMMARY"
